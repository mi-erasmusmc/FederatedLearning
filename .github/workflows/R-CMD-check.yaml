on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-24.04, r: release, rspm: "https://packagemanager.rstudio.com/cran/__linux__/noble/latest" }
          - { os: macos-latest, r: release, rspm: "" }
          - { os: windows-latest, r: release, rspm: "" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      _R_CHECK_DONTTEST_EXAMPLES_: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssh-dev
          Rscript -e 'install.packages("remotes")'
          while read -r cmd
          do
            eval sudo "$cmd"
          done < <(Rscript -e 'writeLines(remotes::system_requirements("ubuntu", "24.04"))')

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          extra-packages: |
            any::rcmdcheck
            github::Penncil/pda
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
          check-dir: '"check"'
