outputRoot: data
atlasBaseUrlEnv: ATLAS_BASE_URL
webApiAuth:
  method: db
  username: "keyring:webapi/username"
  password: "keyring:webapi/password"
generateCohorts: true
createCohortTables: true
generateStats: false
incremental: true
jsonDirectory: extras/atlas_json
# Optional schema used by SqlRender to emulate temporary tables for dialects
# such as Spark/Databricks. Can also be set per data source.
tempEmulationSchema: scratch
overwrite: false
